# GitHub repository settings, applied by traction-control's scripts/repo_settings.py.
# Edit here, open a pull request, and run `repo_settings.py apply` after merge.

[repository]
# One line shown on GitHub. Keep it free of private repository names and local paths.
description = "Local model-serving and agent orchestration helpers for the portfolio: Ollama wrappers, model routing, and lightweight LLM task execution."

[main_branch]
# Direct commits and pushes to main are refused unless this is true.
allow_direct = false
