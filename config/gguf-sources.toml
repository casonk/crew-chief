# llama.cpp-native GGUF files for the models pulled into Ollama.
#
# Each entry is the same model and quantization as the Ollama copy, published
# in llama.cpp's own format. `crew-chief gguf fetch` downloads them and checks
# the SHA-256; scripts/engine_matrix.py benchmarks Ollama, llama.cpp on
# Ollama's file, and llama.cpp on this file, with identical settings.
#
# Why: llama.cpp cannot load some of Ollama's files (new architectures, vision
# weights packed into the model file), and comparing both files separates an
# engine difference from a file difference.
#
# Not listed: the decision models (clef, clef-flash, nimble, tev1). They are
# Ollama-only, have no text-completion endpoint, and are measured with
# `crew-chief taskbench` instead.

