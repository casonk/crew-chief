[[jobs]]
name            = "crew-chief-benchmark-weekly"
description     = "Weekly Ollama model benchmark — tok/s, TTFT, VRAM across all local models"
scope           = "user"
service_type    = "oneshot"
working_directory = "%h/git/util-repos/crew-chief"
exec_start      = "/usr/bin/bash %h/git/util-repos/crew-chief/scripts/run_benchmark.sh"
after           = ["network.target"]
standard_output = "journal"
standard_error  = "journal"
timer_description = "Weekly crew-chief Ollama model benchmark — Sunday 04:00"

[jobs.environment]
REPO_ROOT = "%h/git/util-repos/crew-chief"

[jobs.timer]
kind                 = "calendar"
on_calendar          = "Sun *-*-* 04:00:00"
persistent           = true
randomized_delay_sec = "600"

[jobs.cron]
expression = "0 4 * * 0"
command    = "cd $HOME/git/util-repos/crew-chief && /usr/bin/bash scripts/run_benchmark.sh >> $HOME/.local/share/crew-chief-benchmark/cron.log 2>&1"
comments   = ["Auto-generated from systemd timer: Sun *-*-* 04:00:00"]

# --- macOS ----------------------------------------------------------------
# Applied only when rendering for launchd-user; the systemd and cron
# renderings above are untouched.
[jobs.launchd]
# launchd has no ordering dependencies.
after = []
# /usr/bin/bash does not exist on macOS at all -- the system shell is /bin/bash.
# The repositories also live under ~/dev on the macOS workstation rather than
# ~/git, so the working directory and REPO_ROOT have to move with it.
exec_start = "/bin/bash %h/dev/util-repos/crew-chief/scripts/run_benchmark.sh"
working_directory = "%h/dev/util-repos/crew-chief"

[jobs.launchd.environment]
REPO_ROOT = "%h/dev/util-repos/crew-chief"

[jobs.launchd.timer]
# launchd cannot express jitter.
randomized_delay_sec = ""
