# Serving policy: which backend serves each local model, and how.
#
# Governance (see docs/serving-policy.md):
# - Every model pulled into Ollama has an entry; `crew-chief policy check --live`
#   reports any that do not, and the portfolio audit runs it.
# - `default` and `beta` entries cite benchmark evidence under results/ and a
#   reviewed date. Change an entry only in a pull request that adds or cites
#   fresh evidence.
# - `crew-chief code -m <model>` serves the model as recorded here.
#
# status:  default    — reviewed, preferred configuration
#          beta       — reviewed, being trialled; may change
#          unreviewed — pulled, served on Ollama defaults, no evidence yet
#          retired    — do not serve; rotates off hot storage (see [rotation])
# gpu_mib: GPU memory the configuration needs on this host (measured, not estimated).

[backends]
ollama = "http://localhost:11434"
llamacpp = "http://localhost:8081"

# Storage rotation (`crew-chief storage`). Retired models leave hot storage (the
# Ollama volume on M.2) for warm (SATA SSD), then cold (hard disk), then are
# deleted; each tier is benchmarked less often than the one above it. Tier
# paths are host-specific and live in ~/.config/crew-chief/storage.toml.
[rotation.hot]
bench_every_days = 7

[rotation.warm]
bench_every_days = 30
demote_after_days = 90

[rotation.cold]
bench_every_days = 90
delete_after_days = 180

[models."qwen3:32b"]
status = "beta"
backend = "llamacpp"
context = 32768
kv_cache = "q8_0"
flash_attention = true
gpu_mib = 23740
evidence = [
  "results/llamacpp-bench-20261021-124232.md",
  "results/serving-measure-20261021.md",
  "results/bench-idle-20261021.json",
]
reviewed = "2026-10-21"
note = "29.7 tok/s fully on GPU vs 7.1 on Ollama defaults (17% on CPU); needs the GPU to itself"

