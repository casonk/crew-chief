repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      # ruff-format is the preferred formatter (primary enforcer).
      - id: ruff-format
      # ruff lint with auto-fix.
      - id: ruff
        args: [--fix]

  # black is kept as deprecated — remove once ruff format is confirmed stable.
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        # TODO: remove black once ruff format is confirmed stable portfolio-wide

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
