[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crew-chief"
version = "0.1.0"
description = "Local Ollama LLM service and Python client for portfolio-wide trivial inference tasks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Required on Python 3.10 for TOML parsing in the listener feature.
# Python 3.11+ ships tomllib in the standard library.
listener = ["tomli>=2.0; python_version < '3.11'"]
dev = [
    "pytest",
    "ruff",
    "black",
    "dyno_lab @ git+https://github.com/casonk/dyno-lab.git",
]

[project.scripts]
crew-chief = "crew_chief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108", "SIM115", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py310"]
